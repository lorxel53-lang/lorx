<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lorx Astor 🛒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
body{background:#0f0f0f;color:#fff;text-align:center;padding:4vw;}
header{padding:5vw 3vw;background:linear-gradient(90deg,#ff0000,#700000);box-shadow:0 0 20px red;border-radius:15px;}
header h1{font-size:8vw;margin-bottom:2vw;}
header p{font-size:4vw;color:#ddd;}
.countdown{margin:6vw auto;padding:4vw;width:100%;max-width:500px;background:#1c1c1c;border-radius:20px;box-shadow:0 0 15px rgba(255,0,0,.5);}
.countdown h2{margin-bottom:4vw;font-size:5vw;}
#timer{display:flex;justify-content:center;gap:4vw;font-size:7vw;font-weight:bold;color:#ff3b3b;}
.timer-box{background:#222;padding:3vw;border-radius:10px;min-width:20vw;box-shadow:0 0 10px red;}
.timer-label{font-size:3vw;color:#ccc;margin-top:1vw;display:block;}
.buttons{margin-top:6vw;display:flex;justify-content:center;gap:3vw;flex-wrap:wrap;}
button{flex:1;min-width:40%;padding:3vw;font-size:4vw;border:none;border-radius:10px;cursor:pointer;background:red;color:white;transition:.3s;}
button:hover{background:#ff3b3b;transform:scale(1.05);}
footer{margin-top:10vw;padding:4vw;background:#111;color:#aaa;border-top:1px solid #333;font-size:3vw;border-radius:10px;}
#namesList,#adminList{margin-top:5vw;display:flex;flex-direction:column;align-items:center;gap:4vw;}
.name-box{background:#222;padding:3vw;border-radius:10px;width:100%;max-width:500px;font-size:4vw;font-weight:bold;box-shadow:0 0 10px rgba(255,0,0,.4);display:flex;justify-content:space-between;align-items:center;}
.admin-box{background:#222;padding:3vw;border-radius:10px;width:100%;max-width:500px;font-size:4vw;font-weight:bold;box-shadow:0 0 10px rgba(255,0,0,.4);display:flex;justify-content:center;align-items:center;}
.admin-text img,.name-text img{
  width:16px;   /* حجم العلامة */
  height:16px;
  margin:0 2px; /* قريبة جدًا من الكلمة */
  position:relative;
  top:2px;
}
.extra-square{
  background:#c00;
  color:#fff;
  padding:2vw;
  border-radius:8px;
  font-size:3vw;
  margin-left:10px;
}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);color:#fff;display:none;justify-content:center;align-items:center;font-size:6vw;font-weight:bold;z-index:999;}
</style>
</head>
<body>

<header>
  <h1>🛒 Lorx Astor</h1>
  <p>شارك واربح جوائز قيمة</p>
</header>

<section class="countdown">
  <h2>باقي على نهاية المسابقة</h2>
  <div id="timer">
    <div class="timer-box">
      <span id="seconds">00</span>
      <span class="timer-label">ثانية</span>
    </div>
    <div class="timer-box">
      <span id="minutes">00</span>
      <span class="timer-label">دقيقة</span>
    </div>
    <div class="timer-box">
      <span id="hours">00</span>
      <span class="timer-label">ساعة</span>
    </div>
  </div>
</section>

<section class="buttons">
  <button onclick="toggleNames()">عرض المشتركين</button>
  <button onclick="toggleAdmin()">عرض الأدمن</button>
  <button onclick="joinWhatsApp()">للاشتراك في المسابقة</button>
  <button onclick="showDetails()">تفاصيل المسابقة</button>
</section>

<div id="namesList" style="display:none;"></div>
<div id="adminList" style="display:none;"></div>

<div id="overlay">مسابقة ب 500ج</div>

<footer>
  <p>© 2026 جميع الحقوق محفوظة</p>
</footer>

<script>
// التايمر ثابت على صفر
function updateTimer() {
  document.getElementById("hours").innerHTML = "00";
  document.getElementById("minutes").innerHTML = "00";
  document.getElementById("seconds").innerHTML = "00";
}
updateTimer();

// Toggle أسماء المشتركين (BOB يمين + مربع المتسابق الأول شمال + التوثيق شمال الاسم الإنجليزي)
let namesShown = false;
function toggleNames(){
  const namesDiv = document.getElementById("namesList");
  if(namesShown){
    namesDiv.style.display="none";
    namesDiv.innerHTML="";
    namesShown=false;
  }else{
    let listHTML = `
      <div class="name-box">
        <div class="extra-square">المتسابق الأول</div>
        <div class="name-text">
          <img src="lorx.webp" alt="توثيق"> BOB
        </div>
      </div>`;
    namesDiv.innerHTML = listHTML;
    namesDiv.style.display="flex";
    namesShown=true;
  }
}

// Toggle الأدمن (إنجليزي العلامة شمال، عربي العلامة يمين)
let adminShown = false;
function toggleAdmin(){
  const adminDiv = document.getElementById("adminList");
  if(adminShown){
    adminDiv.style.display="none";
    adminShown=false;
  }else{
    const admins = ["Liex","أوشه المشاڪس"];
    let listHTML = "";
    admins.forEach(admin=>{
      const isEnglish = /^[A-Za-z]+$/.test(admin);
      if(isEnglish){
        listHTML += `
          <div class="admin-box">
            <div class="admin-text">
              <img src="lorx.webp" alt="توثيق"> ${admin}
            </div>
          </div>`;
      }else{
        listHTML += `
          <div class="admin-box">
            <div class="admin-text">
              ${admin} <img src="lorx.webp" alt="توثيق">
            </div>
          </div>`;
      }
    });
    adminDiv.innerHTML = listHTML;
    adminDiv.style.display="flex";
    adminShown=true;
  }
}

// زر الاشتراك في المسابقة → يفتح واتساب تلقائيًا
function joinWhatsApp(){
  window.location.href = "https://wa.me/201555615327";
}

// زر تفاصيل المسابقة → يظهر صفحة شفافة
function showDetails(){
  document.getElementById("overlay").style.display="flex";
  setTimeout(()=>{document.getElementById("overlay").style.display="none";},3000);
}
</script>

</body>
</html>
